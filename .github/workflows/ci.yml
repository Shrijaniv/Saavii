name: Checks

# The quality gate: every PR runs these, and the Deploy pipeline re-runs them
# on main before anything ships (workflow_call). See .github/workflows/README.md.

on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture boundaries (ARCHITECTURE.md §6)
        run: npm run check:boundaries
      - name: Tests
        run: npm test
